<style>
/* Layout: full-height studio. Top bar (machine tabs) / 3D viewport with floating control dock / right engineering sidebar. Stacks on phones. */
:root{
  --bg:#0a1017; --panel:#0f1720; --panel2:#142030; --line:#223244;
  --fg:#d6e2ee; --muted:#7e93a8; --cyan:#35d6e8; --amber:#f5a524; --red:#ff4d5a; --green:#4ade80;
  --display:'Space Grotesk',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:13px;overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#root{height:100%}
.app{height:100%;display:flex;flex-direction:column;min-height:0}
.topbar{display:flex;align-items:center;gap:16px;padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.tab{font-family:var(--display);font-weight:600;font-size:13px;padding:7px 12px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.tab:hover{color:var(--fg);border-color:#35506a}
.tab[aria-selected=true]{color:#04222a;background:var(--cyan);border-color:var(--cyan)}
.main{flex:1;display:flex;min-height:0}
.stage{position:relative;flex:1;min-width:0;min-height:0;background:radial-gradient(ellipse at 50% 35%,#16222f 0%,#0a1017 70%)}
.stage canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage canvas:active{cursor:grabbing}
.tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;white-space:nowrap;font-family:var(--mono);font-size:11px;line-height:1;
  padding:5px 8px 5px 7px;border-radius:4px;background:rgba(10,16,23,.86);border:1px solid #2c445a;color:var(--fg);
  display:flex;align-items:center;gap:6px;transition:opacity .25s,border-color .15s,background .15s;will-change:transform,opacity}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.tag:hover{border-color:var(--cyan)}
.tag.sel{background:var(--cyan);color:#04222a;border-color:var(--cyan)}
.tag.sel::before{background:#04222a;box-shadow:none}
.tag.fault{border-color:var(--red);color:#ffd5d8}
.tag.fault::before{background:var(--red);box-shadow:0 0 6px var(--red)}
.dock{position:absolute;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding:8px;border:1px solid var(--line);border-radius:10px;background:rgba(15,23,32,.88);backdrop-filter:blur(6px)}
.grp{display:flex;align-items:center;gap:8px;padding:0 6px;border-right:1px solid var(--line)}
.grp:last-child{border-right:0}
.btn{font-family:var(--body);font-weight:600;font-size:12px;padding:7px 11px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--cyan)}
.btn.on{background:rgba(53,214,232,.16);border-color:var(--cyan);color:var(--cyan)}
.btn.amber{background:rgba(245,165,36,.14);border-color:var(--amber);color:var(--amber)}
.btn:focus-visible,.tab:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.val{font-family:var(--mono);font-size:11px;color:var(--fg);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{accent-color:var(--cyan);width:96px}
select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 8px;font-size:12px;font-family:var(--body);max-width:210px}
.hint{position:absolute;top:10px;left:12px;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.06em;pointer-events:none}
.status{position:absolute;top:10px;right:12px;display:flex;gap:6px;pointer-events:none}
.chip{font-family:var(--mono);font-size:10px;padding:4px 8px;border-radius:99px;border:1px solid var(--line);background:rgba(10,16,23,.8);color:var(--muted)}
.chip.run{color:var(--green);border-color:#1f5a37}
.chip.bad{color:#ffd5d8;border-color:var(--red);background:rgba(255,77,90,.18)}
.side{width:360px;flex:none;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;display:flex;flex-direction:column}
.sec{padding:16px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan)}
.eyebrow.amber{color:var(--amber)} .eyebrow.red{color:var(--red)}
h2{font-family:var(--display);font-size:20px;font-weight:700;margin:4px 0 2px;text-wrap:balance}
h3{font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
p{margin:0;line-height:1.55;color:#bccbda;font-size:13px}
.specs{width:100%;border-collapse:collapse;font-size:12px}
.specs td{padding:5px 0;border-bottom:1px dashed #1d2b3a;vertical-align:top}
.specs td:first-child{color:var(--muted);padding-right:10px}
.specs td:last-child{font-family:var(--mono);text-align:right;color:var(--fg)}
ol.steps{margin:0;padding-left:18px;color:#bccbda;line-height:1.55;font-size:13px;display:flex;flex-direction:column;gap:4px}
ul.sym{margin:0;padding-left:18px;color:#ffd5d8;line-height:1.5;display:flex;flex-direction:column;gap:3px}
.tour{background:linear-gradient(180deg,rgba(245,165,36,.09),transparent)}
.dots{display:flex;gap:4px;margin:10px 0}
.dots i{flex:1;height:3px;border-radius:2px;background:var(--line)} .dots i.d{background:var(--amber)}
.row{display:flex;gap:8px;margin-top:12px}
.partlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pl{font-size:11px;padding:4px 8px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.pl:hover{color:var(--fg);border-color:var(--cyan)}
@media (max-width:860px){
  body{overflow:auto} html,body,#root{height:auto;min-height:100%}
  .app{height:auto}
  .main{flex-direction:column}
  .stage{height:74vh;min-height:460px;flex:none}
  .side{width:auto;border-left:0;border-top:1px solid var(--line);overflow:visible}
  .dock{left:8px;right:8px;padding:6px}
  .grp{border-right:0;padding:0 2px}
  input[type=range]{width:80px}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){.tag{transition:none}}
</style>
<div id="root"></div>
<script>
/* ============================================================
   CONFIG — add a machine by adding an entry here and a builder
   in BUILDERS below. Part `tag` is a local 3D anchor point,
   `explode` is the offset (scene units) at 100% explode.
   ============================================================ */
const CONFIG = {
  motor: {
    name: "3-Phase Induction Motor", short: "Induction Motor",
    camera: { pos: [6.5, 3.6, 7.5], target: [0.4, 0, 0], dist: 11 },
    sim: { label: "Load", unit: "% slip-load" },
    parts: {
      frame:    { name: "Finned Outer Frame", cat: "Housing · Thermal", tag: [-0.9, 1.8, 0.2], explode: [0, 2.6, 0], casing: true,
        principle: "A cast-iron shell holds the stator and carries heat from the core to the air. The radial fins multiply surface area, and the shaft-mounted fan blows air along them (TEFC cooling).",
        fn: "Mechanical support, enclosure protection and heat rejection.",
        specs: [["Material", "Cast iron GG-25"], ["Frame size", "IEC 132M"], ["Protection", "IP55"], ["Cooling", "IC411 (TEFC)"], ["Fins", "36 radial"]] },
      endbells: { name: "End Bells", cat: "Housing · Bearings", tag: [1.7, 1.25, 0.4], explode: [2.2, 0, 0], casing: true,
        principle: "Machined end shields locate the bearings so the rotor stays centred in the stator bore. The air gap is only 0.5 mm in real machines, so alignment matters.",
        fn: "Bearing support, rotor alignment and sealing of the frame ends.",
        specs: [["Bearings", "6208-2RS / 6206-2RS"], ["Material", "Cast iron"], ["Air-gap held", "0.5 mm"], ["Seals", "V-ring + grease"]] },
      stator:   { name: "Laminated Stator Core", cat: "Magnetic circuit", tag: [0, 1.38, 0.5], explode: [0, 0, -2.2],
        principle: "Thin silicon-steel sheets, insulated from each other, stack into a ring with slots. Lamination breaks up eddy-current loops, so core loss stays low at 50 Hz.",
        fn: "Carries the rotating magnetic flux from the windings across the air gap.",
        specs: [["Steel", "M470-50A, 0.5 mm"], ["Stack length", "200 mm"], ["Slots", "36"], ["Flux density", "~1.5 T peak"]] },
      windings: { name: "3-Phase Copper Windings", cat: "Electrical · Stator", tag: [1.3, 0.98, 0], explode: [0, 0, -1.1],
        principle: "Three coil groups sit 120° apart in space and are fed by currents 120° apart in time. Together they build a magnetic field that rotates at synchronous speed Ns = 120·f / P.",
        fn: "Converts the three-phase supply into a rotating magnetic field.",
        specs: [["Rated power", "7.5 kW"], ["Voltage", "400 V Δ"], ["Current", "14.8 A"], ["Poles", "4 (1500 rpm sync)"], ["Insulation", "Class F, 155 °C"]] },
      rotor:    { name: "Squirrel-Cage Rotor", cat: "Electrical · Rotor", tag: [0.2, 0.0, 0.95], explode: [0, 0, 2.2],
        principle: "Aluminium bars short-circuited by end rings sit in a laminated core. The rotating field cuts the bars and induces currents, and the interaction of those currents with the field produces torque. The rotor always runs a little slower than the field (slip).",
        fn: "Produces shaft torque by induction with no brushes or slip rings.",
        specs: [["Bars", "28 cast aluminium"], ["Rated slip", "3.5 %"], ["Rated speed", "1448 rpm"], ["Rated torque", "49.5 N·m"]] },
      shaft:    { name: "Shaft", cat: "Mechanical · Output", tag: [3.0, 0.2, 0], explode: [0, -2.4, 0],
        principle: "A forged steel shaft carries the rotor torque out through the drive-end bearing. A key transmits torque to the coupling or pulley.",
        fn: "Transmits mechanical power to the load.",
        specs: [["Material", "C45 steel"], ["Diameter", "38 mm"], ["Key", "10 × 8 mm"], ["Max radial load", "~1.9 kN"]] },
      fan:      { name: "Rear Cooling Fan", cat: "Thermal · Mechanical", tag: [-2.55, 0.0, 1.15], explode: [-2.0, 0, 0],
        principle: "A fan on the non-drive end pushes air over the finned frame. Airflow scales with shaft speed, so cooling falls when the motor is slowed by a drive.",
        fn: "Forces air along the frame fins to remove winding and core heat.",
        specs: [["Blades", "8 radial"], ["Diameter", "Ø 240 mm"], ["Material", "Glass-filled PA66"], ["Airflow", "~0.12 m³/s"]] },
      terminal: { name: "Terminal Box", cat: "Electrical · Interface", tag: [0.35, 2.35, 0], explode: [0, 3.6, 0],
        principle: "Six winding ends (U1 V1 W1 / U2 V2 W2) land on a terminal block. Links in star or delta set the voltage the motor can run on.",
        fn: "Safe connection point for the three-phase supply and earth.",
        specs: [["Terminals", "6 × M5 + PE"], ["Entry", "M25 gland"], ["Connection", "Delta @ 400 V"], ["Protection", "IP55"]] }
    },
    tour: [
      { part: "terminal", title: "Power arrives", text: "Three phase lines L1, L2 and L3 enter the terminal box and connect to the winding ends." },
      { part: "windings", title: "A rotating field is born", text: "Each phase peaks in turn. Watch the glow travel around the bore: that is the rotating magnetic field." },
      { part: "stator",   title: "Flux gets a path", text: "The laminated core guides the flux across the air gap with low loss." },
      { part: "rotor",    title: "Induction makes torque", text: "The field cuts the rotor bars, induces current, and the rotor chases the field at slightly lower speed." },
      { part: "shaft",    title: "Torque leaves", text: "The shaft carries the mechanical output to the load." },
      { part: "fan",      title: "Waste heat is removed", text: "The shaft-driven fan pushes air through the fins." },
      { part: "frame",    title: "Heat leaves the machine", text: "The frame fins hand the heat to the air stream. Losses of about 8 to 10 % of input power end up here." }
    ],
    faults: {
      overheat: { name: "Overheated Stator Winding", part: "windings",
        symptoms: ["Burning smell and winding hot to touch (>155 °C)", "Thermal relay trips under load", "Phase currents unbalanced, motor hums and loses speed", "Insulation resistance dropping toward 1 MΩ"],
        repair: ["Isolate and lock out the supply.", "Check for overload, blocked airflow or low supply voltage.", "Megger test each phase to earth and between phases.", "Rewind or replace the stator if insulation is damaged.", "Re-check the overload relay setting before restart."] },
      fan: { name: "Failed Cooling Fan", part: "fan",
        symptoms: ["Fan stationary or blades broken", "Frame temperature rises steadily, even at light load", "Overload relay trips after some minutes", "Rattling or grinding from the fan cover"],
        repair: ["Isolate the supply and let the motor cool.", "Remove the fan cover and inspect the fan and its retaining clip.", "Replace the fan; never run the motor without it.", "Clear dust from the fins and the cover grille.", "Run at load and confirm frame temperature stabilises."] }
    }
  },

  pcb: {
    name: "Microcontroller Development Board", short: "Dev Board (PCB)",
    camera: { pos: [0.5, 6.2, 5.6], target: [0, 0, 0], dist: 8.5 },
    sim: { label: "Activity", unit: "% packet rate" },
    parts: {
      board: { name: "FR4 PCB Substrate", cat: "Substrate", tag: [2.6, 0.06, 1.35], explode: [0, -1.0, 0], casing: true,
        principle: "Woven glass cloth soaked in flame-retardant epoxy (FR4) forms a rigid insulator. Copper layers are etched on it and covered with solder mask.",
        fn: "Mechanical base and electrical insulation for all components and traces.",
        specs: [["Material", "FR4, Tg 150 °C"], ["Thickness", "1.6 mm"], ["Layers", "4 (sig / gnd / pwr / sig)"], ["Copper", "1 oz (35 µm)"], ["Size", "60 × 36 mm"]] },
      mcu: { name: "Microcontroller IC", cat: "Digital · Logic", tag: [0.8, 0.5, 0.0], explode: [0, 1.6, 0],
        principle: "A 32-bit CPU core with flash, SRAM and peripherals on one silicon die inside a QFP package. It fetches instructions, runs them, and drives or reads pins.",
        fn: "Runs firmware and controls peripherals.",
        specs: [["Core", "32-bit RISC, 168 MHz"], ["Package", "LQFP-64"], ["Supply", "3.3 V ±5 %"], ["Flash / RAM", "512 kB / 128 kB"], ["Current", "~45 mA active"]] },
      reg: { name: "Linear Voltage Regulator", cat: "Power", tag: [-1.25, 0.4, 0.7], explode: [0, 1.4, 0],
        principle: "A pass transistor acts as a variable resistor. A feedback loop adjusts it so the output stays at 3.3 V while input changes. The extra voltage is dissipated as heat: P = (Vin − Vout) × I.",
        fn: "Turns the 5 V USB rail into a clean 3.3 V logic rail.",
        specs: [["Output", "3.3 V ±2 %"], ["Max current", "800 mA"], ["Dropout", "1.1 V"], ["Package", "SOT-223"], ["Dissipation", "~0.8 W at 500 mA"]] },
      caps: { name: "Electrolytic Capacitors", cat: "Power · Filter", tag: [-1.9, 0.7, -0.95], explode: [0, 2.0, 0],
        principle: "Two foil plates and an electrolyte store charge. They supply current during load spikes and smooth ripple on the supply rails.",
        fn: "Input and output filtering for the regulator.",
        specs: [["Input cap", "100 µF / 16 V"], ["Output cap", "47 µF / 10 V"], ["ESR", "< 0.3 Ω"], ["Life", "2000 h @ 105 °C"]] },
      inductor: { name: "Power Inductor", cat: "Power · Filter", tag: [-0.45, 0.45, 0.7], explode: [0, 1.0, 0.4],
        principle: "A coil on a ferrite core stores energy in a magnetic field and resists changes in current. Here it forms an LC filter with the capacitor to block high-frequency noise from the 3.3 V rail.",
        fn: "Filters switching noise before the MCU supply pin.",
        specs: [["Inductance", "10 µH"], ["Saturation", "1.2 A"], ["DCR", "180 mΩ"], ["Type", "Shielded ferrite SMD"]] },
      usb: { name: "USB-C Power Port", cat: "Interface · Power", tag: [-2.9, 0.5, 0], explode: [-1.6, 0.3, 0],
        principle: "A reversible 24-pin connector. Two 5.1 kΩ resistors on the CC pins tell the host it may supply 5 V. VBUS feeds the board.",
        fn: "Brings in 5 V power and the data lines.",
        specs: [["VBUS", "5 V, up to 1.5 A"], ["Data", "USB 2.0 full speed"], ["CC pull-down", "5.1 kΩ ×2"], ["Shell", "Stainless steel"]] },
      reset: { name: "Reset Tactile Switch", cat: "Input", tag: [2.2, 0.5, -1.2], explode: [0.8, 1.2, 0],
        principle: "A metal dome snaps down to join two contacts. This pulls the MCU reset pin low and restarts the processor.",
        fn: "Manual hardware restart.",
        specs: [["Contact", "SPST momentary"], ["Force", "160 gf"], ["Life", "100 000 cycles"], ["Size", "6 × 6 mm"]] },
      traces: { name: "Glowing Copper Traces", cat: "Interconnect", tag: [1.85, 0.12, 0.85], explode: [0, 0.5, 0],
        principle: "Etched copper tracks carry current. Width sets current capacity and length sets resistance and delay. Power tracks are wider than signal tracks.",
        fn: "Routes power from the USB port, through the regulator, to the MCU, and signals to the pins.",
        specs: [["Power width", "0.6 mm"], ["Signal width", "0.2 mm"], ["Plating", "ENIG finish"], ["Current", "~1 A for 0.6 mm"]] }
    },
    tour: [
      { part: "usb",      title: "5 V enters", text: "VBUS from the USB-C port is the only power source." },
      { part: "traces",   title: "Power route", text: "Wide copper tracks carry current toward the regulator. Amber packets are 5 V." },
      { part: "caps",     title: "Input filtering", text: "The big capacitor absorbs ripple and spikes from the cable." },
      { part: "reg",      title: "Down to 3.3 V", text: "The regulator drops 5 V to 3.3 V. Packets turn cyan after this stage." },
      { part: "inductor", title: "Noise filtering", text: "The inductor and output capacitor remove high-frequency noise." },
      { part: "mcu",      title: "Logic is powered", text: "The microcontroller boots and starts running firmware." },
      { part: "reset",    title: "Manual restart", text: "Pressing the switch pulls the reset pin low." }
    ],
    faults: {
      cap: { name: "Blown Filter Capacitor", part: "caps",
        symptoms: ["Bulged or vented capacitor top, brown residue", "Random MCU resets, brown-out under load", "High ripple on 5 V and 3.3 V rails (scope >200 mV)", "Board warm near the regulator"],
        repair: ["Unplug USB and discharge the board.", "Inspect visually and measure ESR in circuit.", "Desolder and replace with the same value and voltage rating, observing polarity.", "Check the regulator, which may have been stressed by the ripple.", "Measure ripple again after repair."] },
      reg: { name: "Regulator Thermal Shutdown", part: "reg",
        symptoms: ["Regulator too hot to touch", "3.3 V rail collapses after seconds, then returns", "MCU stops or restarts in a cycle", "Worse when peripherals draw high current"],
        repair: ["Unplug the board.", "Check the 3.3 V rail for a short (power off, ohm-meter).", "Reduce load or move heavy loads to a separate supply.", "Improve copper pour under the tab for heat spreading.", "Replace the regulator if its output is out of tolerance."] }
    }
  },

  transformer: {
    name: "Single-Phase Step-Down Transformer", short: "Step-Down Transformer",
    camera: { pos: [6.5, 3.2, 9.5], target: [0, 0, 0], dist: 12.5 },
    sim: { label: "Load", unit: "% load" },
    parts: {
      tank: { name: "Protective Outer Tank", cat: "Housing", tag: [-1.8, 1.4, 1.0], explode: [0, 0, 3.8], casing: true,
        principle: "A welded steel tank holds the core and winding in insulating oil. The oil insulates and carries heat by natural convection to the radiator. Shown with the front wall cut away.",
        fn: "Mechanical protection, oil containment and heat transfer.",
        specs: [["Material", "Mild steel 3 mm"], ["Fluid", "Mineral oil (ONAN)"], ["Oil volume", "~180 L"], ["Protection", "IP54"]] },
      core: { name: "Laminated Silicon-Steel Core", cat: "Magnetic circuit", tag: [0, 1.45, 0.4], explode: [0, 0, -1.8],
        principle: "Grain-oriented silicon steel sheets form a closed loop. Alternating flux set by the primary flows around the loop and links the secondary. Lamination reduces eddy-current loss.",
        fn: "Provides a low-reluctance path to link the two windings.",
        specs: [["Steel", "CRGO M4, 0.27 mm"], ["Flux density", "1.6 T peak"], ["Core loss", "~1.1 W/kg"], ["Type", "Core, two-leg"]] },
      primary: { name: "High-Voltage Primary Winding", cat: "Electrical · HV", tag: [-0.9, 1.0, 0.65], explode: [-1.4, 0.4, 2.4],
        principle: "Many turns of thin copper wire. The AC supply drives a magnetising current that sets up alternating flux in the core.",
        fn: "Takes the 11 kV input and creates the core flux.",
        specs: [["Rated voltage", "11 kV"], ["Turns", "1100 (ratio 27.5 : 1)"], ["Current", "4.5 A"], ["Conductor", "Round Cu, enamel"], ["Insulation", "Class A, paper-oil"]] },
      secondary: { name: "Low-Voltage Secondary Winding", cat: "Electrical · LV", tag: [0.9, 1.0, 0.65], explode: [1.4, 0.4, 2.4],

/* ============================ REACT UI ============================ */
const html = htm.bind(React.createElement);
const { useState, useEffect, useRef, useCallback } = React;

function Slider({ id, label, value, min, max, onChange }) {
  return html`<div className="grp">
    <label className="lbl" htmlFor=${id}>${label}</label>
    <input id=${id} type="range" min=${min} max=${max} value=${value} onChange=${e => onChange(+e.target.value)} />
    <span className="val">${value}%</span></div>`;
}

function App() {
  const canvasRef = useRef(null), tagsRef = useRef(null), studio = useRef(null);
  const [mid, setMid] = useState('motor');
  const [sel, setSel] = useState(null);
  const [tour, setTour] = useState(null);
  const [fault, setFault] = useState('');
  const [explode, setExplode] = useState(0);
  const [xray, setXray] = useState(false);
  const [tags, setTags] = useState(true);
  const [running, setRunning] = useState(true);
  const [speed, setSpeed] = useState(60);
  const [readout, setReadout] = useState('');
  const cfg = CONFIG[mid];

  const pick = useCallback(id => { setTour(null); setSel(id); }, []);
  useEffect(() => {
    const s = studio.current = new Studio(canvasRef.current, tagsRef.current, { onPick: pick, onReadout: setReadout });
    s.setMachine('motor');
    return () => s.destroy();
  }, []);
  // machine switch
  const first = useRef(true);
  useEffect(() => {
    if (first.current) { first.current = false; return; }
    studio.current.setMachine(mid); setSel(null); setTour(null); setFault('');
  }, [mid]);
  // push UI state to the engine
  const tourPart = tour !== null ? cfg.tour[tour].part : null;
  useEffect(() => {
    const s = studio.current; if (!s) return;
    s.S = { running, speed: speed / 100, explode: explode / 100, xray, tags, sel, tourPart, fault: fault || null };
  }, [running, speed, explode, xray, tags, sel, tourPart, fault, mid]);
  useEffect(() => { if (sel && studio.current && studio.current.cfg === cfg) studio.current.focus(sel); }, [sel]);
  useEffect(() => { if (tour !== null) setSel(cfg.tour[tour].part); }, [tour]);
  const onFault = id => { setFault(id); if (studio.current && studio.current.m) studio.current.m.reset(); if (id) { setTour(null); setSel(cfg.faults[id].part); } };
  const resetCam = () => { studio.current.resetCamera(); setSel(null); setTour(null); };

  const part = sel ? cfg.parts[sel] : null;
  const fl = fault ? cfg.faults[fault] : null;
  const tstep = tour !== null ? cfg.tour[tour] : null;

  return html`<div className="app">
    <header className="topbar flex items-center gap-4 flex-wrap">
      <div className="brand"><i></i>Machine Anatomy Studio</div>
      <div className="tabs" role="tablist" aria-label="Machine">
        ${Object.entries(CONFIG).map(([id, m]) => html`<button key=${id} role="tab" aria-selected=${mid === id} className="tab" onClick=${() => setMid(id)}>${m.short}</button>`)}
      </div>
    </header>
    <div className="main">
      <section className="stage">
        <canvas ref=${canvasRef} aria-label="3D model viewport"></canvas>
        <div className="tags" ref=${tagsRef}></div>
        <div className="hint">DRAG ORBIT · RIGHT-DRAG / SHIFT PAN · SCROLL ZOOM · CLICK A PART</div>
        <div className="status flex gap-1.5">
          <span className=${'chip ' + (running ? 'run' : '')}>${running ? '● RUNNING' : '❚❚ PAUSED'}</span>
          ${readout ? html`<span className=${'chip ' + (fault ? 'bad' : '')}>${readout}</span>` : null}
        </div>
        <div className="dock">
          <div className="grp">
            <button className=${'btn ' + (running ? 'on' : '')} onClick=${() => setRunning(!running)}>${running ? 'Pause Simulation' : 'Run Simulation'}</button>
          </div>
          <${Slider} id="spd" label=${'Speed / Load'} value=${speed} min=${10} max=${100} onChange=${setSpeed} />
          <${Slider} id="exp" label="Explode" value=${explode} min=${0} max=${100} onChange=${setExplode} />
          <div className="grp">
            <button className=${'btn ' + (xray ? 'on' : '')} aria-pressed=${xray} onClick=${() => setXray(!xray)}>X-Ray Casing</button>
            <button className=${'btn ' + (tags ? 'on' : '')} aria-pressed=${tags} onClick=${() => setTags(!tags)}>${tags ? 'Hide Tags' : 'Show Tags'}</button>
            <button className="btn" onClick=${resetCam}>Reset Camera</button>
          </div>
          <div className="grp">
            <button className=${'btn amber ' + (tour !== null ? 'on' : '')} onClick=${() => { if (tour === null) { setFault(''); setTour(0); } else setTour(null); }}>${tour === null ? 'Start Tour' : 'Stop Tour'}</button>
            <label className="lbl" htmlFor="flt">Simulate Fault</label>
            <select id="flt" value=${fault} onChange=${e => onFault(e.target.value)}>
              <option value="">No fault</option>
              ${Object.entries(cfg.faults).map(([id, f]) => html`<option key=${id} value=${id}>${f.name}</option>`)}
            </select>
          </div>
        </div>
      </section>
      <aside className="side" aria-label="Engineering panel">
        <div className="sec">
          <div className="eyebrow">Machine</div>
          <h2>${cfg.name}</h2>
          <div className="partlist">
            ${Object.entries(cfg.parts).map(([id, p]) => html`<button key=${id} className="pl" style=${sel === id ? { color: 'var(--cyan)', borderColor: 'var(--cyan)' } : null} onClick=${() => pick(id)}>${p.name}</button>`)}
          </div>
        </div>
        ${tstep ? html`<div className="sec tour">
          <div className="eyebrow amber">Guided tour · Step ${tour + 1} of ${cfg.tour.length}</div>
          <h2>${tstep.title}</h2>
          <p>${tstep.text}</p>
          <div className="dots">${cfg.tour.map((_, i) => html`<i key=${i} className=${i <= tour ? 'd' : ''}></i>`)}</div>
          <div className="row flex gap-2 mt-3">
            <button className="btn" disabled=${tour === 0} style=${{ opacity: tour === 0 ? 0.4 : 1 }} onClick=${() => setTour(Math.max(0, tour - 1))}>← Previous</button>
            <button className="btn amber" onClick=${() => tour < cfg.tour.length - 1 ? setTour(tour + 1) : setTour(null)}>${tour < cfg.tour.length - 1 ? 'Next →' : 'Finish'}</button>
          </div>
        </div>` : null}
        ${fl ? html`<div className="sec" style=${{ background: 'linear-gradient(180deg,rgba(255,77,90,.10),transparent)' }}>
          <div className="eyebrow red">Fault diagnostics</div>
          <h2>${fl.name}</h2>
          <p>Affected part: <b style=${{ color: '#ffd5d8' }}>${cfg.parts[fl.part].name}</b></p>
          <h3>Symptoms</h3><ul className="sym">${fl.symptoms.map((s, i) => html`<li key=${i}>${s}</li>`)}</ul>
          <h3>Repair steps</h3><ol className="steps">${fl.repair.map((s, i) => html`<li key=${i}>${s}</li>`)}</ol>
        </div>` : null}
        <div className="sec" style=${{ borderBottom: 0 }}>
          ${part ? html`<div>
            <div className="eyebrow">${part.cat}</div>
            <h2>${part.name}</h2>
            <h3>Operating principle</h3><p>${part.principle}</p>
            <h3>Engineering function</h3><p>${part.fn}</p>
            <h3>Key specifications</h3>
            <table className="specs"><tbody>${part.specs.map((r, i) => html`<tr key=${i}><td>${r[0]}</td><td>${r[1]}</td></tr>`)}</tbody></table>
          </div>` : html`<div>
            <div className="eyebrow">Part inspector</div>
            <h2>Select a part</h2>
            <p>Click any part in the 3D view, any floating tag, or a name above. The camera will fly to it and its principle, function and specifications will appear here.</p>
          </div>`}
        </div>
      </aside>
    </div>
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);

</script>

</body></html>
